<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Read the room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFF5; --surface:#FFFFFF; --ink:#12162B; --muted:#586080; --line:#C3C9DC;
  --accent:#2B3FD6; --accent-ink:#FFFFFF;
  --tape:#F2C230; --tape-bg:#FFF4CC;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C1020; --surface:#161B30; --ink:#EEF0FA; --muted:#A3ABC8; --line:#343C62;
    --accent:#8C9CFF; --accent-ink:#0C1020;
    --tape:#F2C230; --tape-bg:#2C2610;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.5;
  padding:0 0 calc(150px + env(safe-area-inset-bottom));
}
main{max-width:560px;margin:0 auto;padding:22px 18px 8px}
body.has-mini main{padding-top:70px}
h1,h2,h3{font-stretch:76%;font-weight:800;letter-spacing:.005em;line-height:1.05;margin:0}
h1{font-size:44px}
h2{font-size:30px;margin-bottom:6px}
h3{font-size:21px;margin:28px 0 8px}
.tapebar{display:block;width:72px;height:8px;background:var(--tape);margin:10px 0 14px;transform:skewX(-24deg)}
.lede{color:var(--muted);margin:0 0 22px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
a{color:var(--accent);font-weight:600}

.q{margin:0 0 22px;border:0;padding:0;min-width:0}
.q legend{font-weight:700;margin-bottom:8px;padding:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.four{grid-template-columns:repeat(4,1fr)}
.opt{
  font:inherit;color:var(--ink);background:var(--surface);
  border:2px solid var(--line);border-radius:8px;padding:12px 10px;min-height:52px;
  text-align:left;cursor:pointer;line-height:1.25;
}
.opts.four .opt{text-align:center;padding:12px 4px}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{
  font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:999px;
  padding:8px 16px;min-height:46px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.chip[aria-pressed="true"]::before{content:"\2713\00a0"}

.btn{
  font:inherit;font-weight:700;border-radius:10px;padding:14px 18px;min-height:52px;cursor:pointer;
  border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);width:100%;
}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn + .btn{margin-top:10px}
.linkbtn{font:inherit;background:none;border:0;color:var(--accent);padding:8px 0;cursor:pointer;font-weight:600;min-height:44px}

.signals{border-top:1px solid var(--line);margin-top:6px}
.sig{
  display:block;width:100%;text-align:left;font:inherit;color:var(--ink);
  background:none;border:0;border-bottom:1px solid var(--line);padding:14px 10px 14px 12px;cursor:pointer;min-height:68px;
}
.sig b{display:block;font-weight:600}
.sig span{color:var(--muted);font-size:14px}
.sig[aria-pressed="true"]{background:var(--surface);box-shadow:inset 8px 0 0 var(--tape);padding-left:20px}
.sig[aria-pressed="true"] b{font-weight:800}
.sig[aria-pressed="true"] b::before{content:"\2713\00a0"}

details.probe{background:var(--tape-bg);border-left:6px solid var(--tape);padding:0 14px;margin:0 0 22px}
details.probe summary{padding:14px 0;font-weight:700;cursor:pointer;min-height:48px}
details.probe p, details.probe li{font-size:15px}

.note{border-left:6px solid var(--tape);background:var(--tape-bg);padding:10px 14px;margin:0 0 10px;font-size:15px}
.note b{font-weight:700}

.row{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.row .mins{min-width:58px;font-weight:700;font-stretch:80%}
.row .txt b{display:block}
.row .txt span{color:var(--muted);font-size:15px}

details.block{border-top:1px solid var(--line)}
details.block summary{
  list-style:none;display:flex;align-items:stretch;gap:12px;cursor:pointer;padding:12px 0;min-height:64px;
}
details.block summary::-webkit-details-marker{display:none}
.bar{width:8px;flex:none;background:var(--accent);transform:skewX(-12deg)}
.bt{flex:1}
.bt b{display:block;font-size:20px;font-stretch:82%;font-weight:800;line-height:1.15}
.bt small{color:var(--muted);font-size:14px}
.mins{font-weight:700;font-stretch:80%;white-space:nowrap;align-self:center}
details.block[open] > summary{padding-bottom:6px}
.body{padding:2px 0 16px 20px}
.body p{font-size:16px}
.body p strong{font-weight:700}
.body .rules{border-left:6px solid var(--tape);background:var(--tape-bg);padding:8px 12px}
.body details.block{margin-left:-20px;padding-left:20px}

.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:10px;height:10px;border:2px solid currentColor;display:block}
.pips i.on{background:currentColor}
.lvtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 14px}
.lvtab{
  font:inherit;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:8px;
  padding:8px 4px;min-height:74px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;line-height:1.1;
}
.lvtab b{font-weight:700;font-size:15px}
.lvtab small{font-size:13px;opacity:.85}
.lvtab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lvrow{display:flex;gap:10px;padding:4px 0 8px}
.lvrow .pips{flex:none;margin-top:6px}
.lvrow p{margin:0;font-size:15px}
.stationbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.stationbtns .btn{width:auto;flex:1;min-width:140px;padding:10px 14px;min-height:48px}
.stationbtns .btn + .btn{margin-top:0}

ul.plain,ol.plain{padding-left:20px;margin:0 0 10px}
ul.plain li,ol.plain li{margin-bottom:6px}
.lever{padding:8px 0;border-top:1px solid var(--line)}
.lever b{font-weight:700}
.lever p{margin:2px 0 0;font-size:15px}

.field{display:block;margin:0 0 12px}
.field span{display:block;font-weight:600;font-size:15px;margin-bottom:4px}
.field textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);
  border-radius:8px;padding:10px;min-height:64px;resize:vertical;
}
#customOut{white-space:pre-wrap;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:12px;font-size:15px;margin:0 0 10px}

#buildbar{
  position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:9;
  background:var(--bg);border-top:1px solid var(--line);padding:10px 18px;
}
#buildbar .in{max-width:560px;margin:0 auto}
#mini{
  position:fixed;top:0;left:0;right:0;z-index:15;background:var(--ink);color:var(--bg);
  display:flex;align-items:center;gap:10px;padding:6px 10px 6px 14px;padding-top:calc(6px + env(safe-area-inset-top));
}
#mini[hidden]{display:none}
#mini .mt{
  flex:1;font:inherit;font-weight:800;font-stretch:80%;font-size:20px;background:none;border:0;color:inherit;
  text-align:left;cursor:pointer;min-height:44px;font-variant-numeric:tabular-nums;
}
#mini .mb{
  font:inherit;font-weight:700;background:var(--tape);color:#12162B;border:0;border-radius:8px;
  padding:0 16px;min-height:44px;cursor:pointer;
}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:10;
}
nav.tabs button{
  font:inherit;font-weight:600;background:none;border:0;color:var(--muted);min-height:60px;cursor:pointer;
  border-top:4px solid transparent;
}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--tape);font-weight:800}

.timer{text-align:center;padding:18px 10px 20px;margin:0 0 20px;border:2px solid var(--line);background:var(--surface)}
.timer.rest{background:var(--tape-bg);border-color:var(--tape)}
#tdisp{font-size:92px;font-stretch:70%;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#tstat{color:var(--muted);margin:6px 0 16px}
.timer .btn{max-width:260px}

#toast{
  position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;
  pointer-events:none;transition:opacity .2s;z-index:20;
}
#toast.on{opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="mini" hidden>
  <button class="mt" id="mtxt" data-a="tab" data-v="timer">0:00</button>
  <button class="mb" id="mbtn" data-a="ttoggle">Pause</button>
</div>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<nav class="tabs" aria-label="Sections">
  <button data-a="tab" data-v="plan">Plan</button>
  <button data-a="tab" data-v="skills">Skills</button>
  <button data-a="tab" data-v="library">Library</button>
  <button data-a="tab" data-v="timer">Timer</button>
</nav>

<script>
/* =====================  DATA  ===================== */
const LV = ["Learn","Oppose","Complicate"];
const STATIONS = [
  {id:"standing", name:"Standing",           sub:"Hand-fight and takedown range"},
  {id:"guard",    name:"Guard and passing",  sub:"One player on the bottom, one passing"},
  {id:"pins",     name:"Pins and escapes",   sub:"Top control and getting out"},
  {id:"finish",   name:"Finishing",          sub:"Set positions, slow and safe"}
];

const SKILLS = [
/* ---------------- Pushing and pulling ---------------- */
{
 id:"push_pull", name:"Pushing and pulling",
 seeing:"People meet force with force, or get pulled off balance and stay there",
 what:"Using a push or pull to get a reaction, then using that reaction. And answering force without meeting it head-on.",
 cues:["Push to get a push back, then change direction","When pulled, move with it instead of bracing","Notice what your partner does with the force before you act"],
 asks:["What did they do when you pushed?","What happened when you stopped resisting?","Which direction felt easier to use?"],
 warm:"Light push and follow: one partner pushes slowly, the other moves with it and keeps balance. Swap every 30 seconds.",
 live:"Live rounds: a bonus point whenever you use your partner's push or pull to take a position.",
 games:{
  standing:{n:"Make them step",
   setup:"Face each other in a loose clinch, hands on shoulders or upper arms.",
   a:"Push or pull to make your partner take a step.",
   b:"Stay planted and try the same on A.",
   lv:["Only A scores. B resists at about 50% and stays planted.","Both can score. Any foot that moves counts as a step.","A step only counts if you used two directions in a row: push then pull, or pull then push."],
   watch:"Do they brace against the force or move with it? Do they change direction?",
   ask:"What did your partner do just before they stepped?", sec:30},
  guard:{n:"Gap control",
   setup:"Bottom is on their back with legs up. Top kneels or stands in front of the legs.",
   a:"Top: close the gap to chest-to-knees or past the legs.",
   b:"Bottom: use pushes and pulls to control the distance.",
   lv:["Bottom may only push (hands or feet) to keep a gap. Top moves slowly.","Bottom may push or pull. Top scores for chest contact held 3 seconds.","Bottom must alternate push and pull each time top moves. Top may not stay in one spot."],
   watch:"Is the bottom pulling the top into positions they want, or only defending? Does the top follow the force or fight it?",
   ask:"When did pulling work better than pushing?", sec:45},
  pins:{n:"Push, then pull",
   setup:"Top holds side control. Bottom is pinned on their back.",
   a:"Bottom: make space by pushing, then escape by pulling your hips away.",
   b:"Top: keep the pin and follow the movement.",
   lv:["Top is heavy but still. Bottom only pushes the hips or shoulder to make a gap.","Top follows and re-closes. Bottom scores for getting a knee in front of the partner.","Top may push back. Bottom must switch between pushing and pulling to escape."],
   watch:"Are they pushing with the arms only? Do the hips get involved?",
   ask:"What changed when the push stopped working?", sec:45},
  finish:{n:"Follow the reaction",
   setup:"Attacker holds a dominant position and controls one arm. No squeezing, set positions only.",
   a:"Attacker: use the defender's push or pull to line up a submission position, then stop.",
   b:"Defender: push or pull to stop the lineup.",
   lv:["Defender only pulls the arm back. Attacker follows it and sets the position.","Defender may push or pull. Attacker must answer with the opposite direction.","Attacker must switch to a different submission position if the defender's reaction blocks the first."],
   watch:"Does the attacker keep the position while chasing? Do they feel the reaction before acting?",
   ask:"What did the defender's reaction tell you?", sec:45}
 }
},
/* ---------------- Rotating and movement ---------------- */
{
 id:"rotating", name:"Rotating and movement",
 seeing:"People stay flat and square, and stall when they cannot go straight",
 what:"Turning the hips, shoulders and whole body to create angles instead of pushing straight on.",
 cues:["Turn the hips before you push","Move your partner's centre around, not through","Notice where your partner's shoulders face"],
 asks:["Which part of you turned first?","What changed when you moved to the side?","Where was your partner pointing?"],
 warm:"Light circling: partners move around each other in a loose clinch, changing angles without trying to score.",
 live:"Live rounds: a bonus point whenever you finish a position by getting to a new angle.",
 games:{
  standing:{n:"Angle first",
   setup:"Face each other in a loose clinch.",
   a:"Move to a new angle (about 45 degrees off centre) and hold it for 3 seconds.",
   b:"Stay square to your partner and deny the angle.",
   lv:["B only turns to face A and does not score.","Both score for holding an angle 3 seconds.","Your score only counts if you also take a control (head, arm or hip) from the new angle."],
   watch:"Do they step or only lean? Where do the feet go?",
   ask:"What did you do with your feet first?", sec:30},
  guard:{n:"Hips to face",
   setup:"Bottom is on their back with legs up. Top is on their knees in front.",
   a:"Bottom: turn your hips so your legs always face the top.",
   b:"Top: move around to the side.",
   lv:["Top walks slowly. Bottom only turns to keep the legs in front.","Top moves at about 70%. Bottom scores for each 30 seconds without being passed.","Bottom must turn and then come up (stand or sweep) to score. Top scores for passing."],
   watch:"Are they pivoting or sitting still? Do the hips follow the partner?",
   ask:"What made you turn?", sec:45},
  pins:{n:"Turn to the knees",
   setup:"Top holds side control. Bottom starts on their back.",
   a:"Bottom: turn onto your side and get to your knees.",
   b:"Top: stay on top and keep chest contact.",
   lv:["Top gives about 30% pressure. Bottom may turn in either direction.","Top follows and keeps weight on. Bottom scores for getting to their knees.","Bottom's score only counts if they end facing the top, not turtled away."],
   watch:"Do they turn the hips first, or push with the arms?",
   ask:"Which way was easier to turn, and why?", sec:45},
  finish:{n:"New angle, same finish",
   setup:"Attacker has a dominant position and a set submission position. No squeezing.",
   a:"Attacker: step or turn to a new angle and re-set the same position.",
   b:"Defender: turn to face the attacker.",
   lv:["Defender only turns. Attacker moves slowly.","Defender turns and fights the hands. Attacker scores by re-setting the position.","Attacker may not use the same angle twice in a row."],
   watch:"Is the attacker turning their body or chasing with the arms? Do they stay connected?",
   ask:"Which angle made the position easiest to set?", sec:45}
 }
},
/* ---------------- Height and posture ---------------- */
{
 id:"height_posture", name:"Height and posture",
 seeing:"People stand tall and get taken down, or round the back and give up posture",
 what:"Keeping your own head and spine strong while changing levels, and disrupting your partner's.",
 cues:["Head up, spine long","Change levels before you change position","Notice whose head is lower"],
 asks:["Who was lower, and what did it change?","What happened when your posture broke?","How could you have stayed lower?"],
 warm:"Light level changes: drop from stance to a low crouch and back, hands up, 30 seconds. Then mirror a partner.",
 live:"Live rounds: a bonus point when you win the lower position or break your partner's posture.",
 games:{
  standing:{n:"Win the lower position",
   setup:"Face each other in stance, hands up.",
   a:"Get your head and hips lower than your partner's and hold it for 3 seconds.",
   b:"Do the same. The lower player scores.",
   lv:["Only A tries to get lower. B holds their height steady.","Both try. Score when you are lower for 3 seconds.","Score only if you are lower and your back stays flat (no rounding)."],
   watch:"Do they lower with the knees and hips, or round the back? Where is the head?",
   ask:"What happened to your balance when you went lower?", sec:30},
  guard:{n:"Break the posture",
   setup:"Bottom plays closed or open guard. Top kneels upright with a long spine.",
   a:"Bottom: bring the top's head down toward your chest and keep it there.",
   b:"Top: keep your head up and spine long.",
   lv:["Top holds posture and resists at about 50%. Bottom works to lower the head.","Both play. Bottom scores for a broken posture held 3 seconds. Top scores for standing or passing.","Bottom's score only counts if the top's head goes below the bottom's chest line."],
   watch:"Does the top keep the head up? Is the bottom pulling with the arms only, or using the hips?",
   ask:"What did you notice when the head came down?", sec:45},
  pins:{n:"Heavy and low",
   setup:"Top holds side control. Bottom is on their back.",
   a:"Top: stay low (chest and hips down) and hold the pin.",
   b:"Bottom: lift the top's chest or head to escape.",
   lv:["Bottom only pushes to lift the top's chest. Top stays low.","Bottom may bridge and shrimp. Top scores for 20 seconds held.","Top must also change pins while staying low (for example side control to scarf hold or north-south)."],
   watch:"Is the top low and heavy, or posted tall? Does the bottom use the hips?",
   ask:"When did you feel the pin getting lighter?", sec:45},
  finish:{n:"Stay low to finish",
   setup:"Attacker has a dominant position and a set submission position. No squeezing.",
   a:"Attacker: keep your head and hips low and connected while setting the position.",
   b:"Defender: lift the attacker's height (bridge, frame) to break the connection.",
   lv:["Defender gives light resistance. Attacker stays low.","Defender may bridge and frame. Attacker scores for the set held 5 seconds.","Attacker must also change sides or submission without rising up."],
   watch:"Does the attacker stay tight or lift to look? Does the defender make them rise?",
   ask:"What made you rise up?", sec:45}
 }
},
/* ---------------- Handfighting ---------------- */
{
 id:"handfighting", name:"Handfighting",
 seeing:"Grips get stripped, hands go passive, or everyone is stuck in a clinch with no way through",
 what:"Fighting for contact and control with the hands and arms: inside position, wrist control and winning the first touch.",
 cues:["Hands inside, elbows in","Break their connection before you make yours","Use two hands against one"],
 asks:["Who had inside position, and how did you get it?","What did they do to break your grip?","What did you do when your hand got knocked away?"],
 warm:"Light hand fighting: partners take and break wrist and upper-arm contacts at about 30% for 30-second rounds.",
 live:"Live rounds: a bonus point for winning inside hand position before anything else happens.",
 games:{
  standing:{n:"Inside hands",
   setup:"Face each other, hands up, no gi. Both reach for each other's shoulders or upper arms.",
   a:"Win inside position (hands inside their arms) and hold it for 3 seconds.",
   b:"Do the same. Whoever holds the inside scores.",
   lv:["Only A tries. B keeps hands up and resists at about 50%.","Both try to win inside position.","Score only if you take a second control (head, arm or hip) from the inside position."],
   watch:"Are the hands moving, or stuck? Who breaks contact first?",
   ask:"How did you get your hands inside?", sec:30},
  guard:{n:"Hands before legs",
   setup:"Bottom is seated or on their back with legs up. Top is on their knees in front.",
   a:"Bottom: control the top's wrists or head with your hands before using your legs.",
   b:"Top: keep your hands free and place them on the hips or knees.",
   lv:["Top keeps hands still. Bottom practises catching and holding wrists.","Top fights to free the hands. Bottom scores for a wrist held 3 seconds.","Bottom's score only counts if they then use the legs (sweep, off-balance or reguard) while keeping the hand control."],
   watch:"Do they use the legs too early? Can the top free the hands quickly?",
   ask:"What did you notice about the hands before the legs?", sec:45},
  pins:{n:"Pin the hands",
   setup:"Top holds side control or mount. Bottom is on their back.",
   a:"Top: control the bottom's hands (wrists or elbows) while keeping the pin.",
   b:"Bottom: keep a hand free and framed.",
   lv:["Bottom keeps one hand framed. Top works to control one wrist.","Both play. Top scores for both hands controlled for 5 seconds.","Top must win the pin first, then the hands. Bottom scores by freeing a hand and framing."],
   watch:"Is the top chasing hands and losing the pin? Does the bottom keep frames?",
   ask:"What did you give up to get the hands?", sec:45},
  finish:{n:"Grip first",
   setup:"Attacker is in a dominant position. No squeezing.",
   a:"Attacker: win the grip needed for a submission position (arm, wrist or head), then stop.",
   b:"Defender: stop the grip with hand fighting.",
   lv:["Defender gives light resistance. Attacker focuses on the grip.","Defender fights the hands. Attacker scores for the grip held 5 seconds.","Attacker must win the grip using their weaker hand."],
   watch:"Do they chase one grip or look for alternatives?",
   ask:"Which grip was hardest to get?", sec:45}
 }
},
/* ---------------- Base and destabilization ---------------- */
{
 id:"base_destab", name:"Base and destabilization",
 seeing:"People get swept or taken down easily, or cannot move their partner at all",
 what:"Staying balanced yourself while taking away your partner's balance by moving their base or centre.",
 cues:["Keep feet or knees under the hips","Move the base, not just the head","Feel where their weight is before you move them"],
 asks:["Where was your base when you lost balance?","What did you move to unbalance them?","Which way was their weight going?"],
 warm:"Light balance drill: partners hold a clinch and take turns gently shifting each other's weight for 30 seconds.",
 live:"Live rounds: a bonus point whenever you take your partner off balance and keep your own.",
 games:{
  standing:{n:"Move the base",
   setup:"Face each other in a loose clinch, both in stance.",
   a:"Make your partner's foot move, or a knee touch the mat, by moving their base.",
   b:"Stay balanced and do the same to A.",
   lv:["Only A scores. B resists at about 50%.","Both score for a foot move or a knee touching the mat.","Your score only counts if your own feet stay planted."],
   watch:"Do they move the head or the hips? Where do the feet go?",
   ask:"What was your partner's weight doing just before they moved?", sec:30},
  guard:{n:"Off-balance the top",
   setup:"Bottom is seated or on their back. Top is on their knees or standing and tries to pass.",
   a:"Bottom: take the top's base away (hips, knees or hands) so they fall to the side or sit down.",
   b:"Top: keep a wide, stable base.",
   lv:["Top stays still. Bottom finds a way to move their base.","Top moves and resists. Bottom scores when the top's hip or hand touches the mat.","Top may also attack the bottom's base. Both score for off-balancing the other."],
   watch:"Where do the top's hands and knees land? Does the bottom move the feet or only the hands?",
   ask:"What happened to the top's base before they fell?", sec:45},
  pins:{n:"Wide base, loose base",
   setup:"Top holds side control. Bottom is pinned.",
   a:"Bottom: take away the top's base (knees or hips) to roll them off or make space.",
   b:"Top: keep a wide, stable base.",
   lv:["Top holds still. Bottom looks for a knee or hip to move.","Top follows and adjusts. Bottom scores when the top loses base (knee off the mat or off balance).","Top may attack the bottom's base too. Both score."],
   watch:"Where are the top's knees? Are they wide?",
   ask:"Which knee felt lighter?", sec:45},

const ROOM = {
 new:{label:"Mostly new", note:"Keep goals obvious and one-sided. Demo for under two minutes, then let them play. Start at level 1 and move up only when it looks easy."},
 mixed:{label:"Mixed levels", note:"Give the more experienced partner an extra constraint (lower resistance, fewer tools, a harder goal). Rotate partners so skill levels vary."},
 adv:{label:"Mostly experienced", note:"Remove the obvious answers. Start at level 2 and ask what they are trying to solve."},
 unsure:{label:"Level unclear", note:"Start gentle. Watch the first two rounds, then switch levels up or down."}
};
const PEOPLE = {
 s:{label:"Up to 6", note:"Small room: rotate partners every round. For odd numbers, run a triad where the third person watches and answers the Ask question."},
 m:{label:"7 to 12", note:"Give each pair a clear slice of mat. Rotate on your call so people meet different bodies."},
 l:{label:"13 to 20", note:"Tape lanes or zones and use short rounds. Keep the rules simple so you can roam and watch."},
 xl:{label:"20+", note:"Split into two groups on separate mat areas, each running the same game. Use one clear call for start and stop."}
};
const BASE = {
 30:{warm:3, live:5,  close:2},
 45:{warm:4, live:7,  close:3},
 60:{warm:5, live:9,  close:4},
 90:{warm:7, live:13, close:5}
};
const FRAC = {new:[.6,.4,0], mixed:[.3,.4,.3], adv:[0,.4,.6], unsure:[.4,.4,.2]};

const DIALS = [
 ["Space","Shrink the area or tape lanes so players meet sooner."],
 ["Time","Short rounds add urgency. Long rounds let ideas develop."],
 ["Goal","Change what scores, or give each player a different goal."],
 ["Start position","Start closer to the action, or from a worse spot."],
 ["Rule","Ban or require a move to force new answers."],
 ["Resistance","Say it out loud: 30, 50, 70 or full."],
 ["People","Change pairs or triads. Handicap the more experienced player."]
];
const LOOP = [
 "Explain the game in under two minutes. Show the start and the scoring, not a technique.",
 "Run two rounds without stopping. Watch.",
 "Say what you saw in one sentence.",
 "Change one level or one dial. Run two more rounds.",
 "Ask one question. Let them answer with their next round."
];
const SAFETY = [
 "Say the intensity out loud before each game (for example 50%).",
 "Tap early, release at once.",
 "No slams, neck cranks or heel hooks unless the room is experienced and has agreed.",
 "Finishing games stop at a set position unless you decide otherwise.",
 "Ask about injuries first and offer lighter roles. Keep mat edges and walls clear."
];
const SMGC = "https://slimemoldgrappling.com";
const REPO = {
 standing:[["Takedowns",SMGC+"/games/take_downs/index.html"],["Scrambles",SMGC+"/games/scrambles/index.html"]],
 guard:[["Guard",SMGC+"/games/guard_games/index.html"]],
 pins:[["Pinning",SMGC+"/games/pinning/index.html"],["Side control",SMGC+"/games/side_control/index.html"],["Mount",SMGC+"/games/mount/index.html"],["Knee on belly",SMGC+"/games/knee_on_belly/index.html"],["North south",SMGC+"/games/north_south/index.html"]],

/* =====================  STATE  ===================== */
const KEY = "readTheRoom.v2";
const S = {tab:"plan", view:"setup", level:"unsure", time:60, people:"m",
           stations:["standing","guard","finish"], skill:null, lv:{}, open:{}, awake:false, custom:{}};
const T = {work:60, rest:10, phase:"work", remaining:60, round:1, running:false, started:false, endAt:0, ctx:null, wl:null, awakeLock:null};
const $ = s => document.querySelector(s);

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({level:S.level,time:S.time,people:S.people,stations:S.stations,skill:S.skill})); }catch(e){}
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY) || "null"); if(!d) return;
    if(ROOM[d.level]) S.level = d.level;
    if(BASE[d.time]) S.time = d.time;
    if(PEOPLE[d.people]) S.people = d.people;
    if(Array.isArray(d.stations)){
      const ok = STATIONS.map(s=>s.id).filter(id=>d.stations.includes(id));
      if(ok.length) S.stations = ok;
    }
    if(SKILLS.some(k=>k.id===d.skill)) S.skill = d.skill;
  }catch(e){}
}

/* =====================  SESSION MODEL  ===================== */
const skillById = id => SKILLS.find(k=>k.id===id);
function stationMins(n){
  const b = BASE[S.time], pool = S.time - b.warm - b.live - b.close;
  const base = Math.floor(pool/n); let rem = pool - base*n;
  return Array.from({length:n}, (_,i)=> base + (i<rem?1:0));
}
function levelMins(m){
  const f = FRAC[S.level];
  const a = Math.round(m*f[0]); let b = Math.round(m*f[1]); let c = m-a-b;
  if(c<0){ b += c; c = 0; }
  return [a,b,c];
}
function session(){
  const sk = skillById(S.skill);
  const ids = STATIONS.map(s=>s.id).filter(id=>S.stations.includes(id));
  const mins = stationMins(ids.length);
  return {sk, b:BASE[S.time], items: ids.map((id,i)=>({
    st: STATIONS.find(s=>s.id===id), g: sk.games[id], mins: mins[i], lm: levelMins(mins[i])
  }))};
}
function curLevel(it){
  if(S.lv[it.st.id] !== undefined) return S.lv[it.st.id];
  const i = it.lm.findIndex(x=>x>0); return i<0 ? 0 : i;
}
function summaryLine(){
  return S.time+" min. "+ROOM[S.level].label+". "+PEOPLE[S.people].label+" people. "+S.stations.length+" stations.";
}

/* =====================  HTML HELPERS  ===================== */
function pips(n){ return '<span class="pips" aria-hidden="true">'+[0,1,2].map(i=>'<i'+(i<n?' class="on"':'')+'></i>').join("")+'</span>'; }

function stationHTML(it, idx, items){
  const id = it.st.id, g = it.g, cur = curLevel(it), next = items[idx+1];
  const tabs = LV.map((nm,i)=>
    '<button class="lvtab" data-a="lv" data-st="'+id+'" data-v="'+i+'" aria-pressed="'+(i===cur)+'" aria-label="Level '+(i+1)+' of 3, '+nm+'">'+
    pips(i+1)+'<b>'+nm+'</b><small>'+(it.lm[i]>0 ? it.lm[i]+' min' : 'optional')+'</small></button>').join("");
  return '<section class="station" id="st-'+id+'"><details class="block" data-id="'+id+'"'+(S.open[id]?' open':'')+'>'+
   '<summary><span class="bar"></span><span class="bt"><b>'+it.st.name+': '+g.n+'</b><small>'+it.st.sub+'</small></span><span class="mins">'+it.mins+' min</span></summary>'+
   '<div class="body">'+
   '<div class="lvtabs" role="group" aria-label="Level">'+tabs+'</div>'+
   '<p class="rules"><strong>Level '+(cur+1)+', '+LV[cur].toLowerCase()+'.</strong> '+g.lv[cur]+'</p>'+
   '<p><strong>Setup.</strong> '+g.setup+'</p>'+
   '<p><strong>A.</strong> '+g.a+'</p>'+
   '<p><strong>B.</strong> '+g.b+'</p>'+
   '<p><strong>Rounds.</strong> '+g.sec+' seconds, swap roles, then new partner.</p>'+
   '<p><strong>Watch for.</strong> '+g.watch+'</p>'+
   '<p><strong>Ask.</strong> '+g.ask+'</p>'+
   '<div class="stationbtns">'+
   '<button class="btn ghost" data-a="settimer" data-sec="'+g.sec+'">Set timer: '+g.sec+'s rounds</button>'+
   (next ? '<button class="btn" data-a="next" data-v="'+next.st.id+'">Next: '+next.st.name+'</button>' : '')+
   '</div></div></details></section>';
}
function paintStation(id){
  const ss = session(), idx = ss.items.findIndex(i=>i.st.id===id), el = document.getElementById("st-"+id);
  if(el && idx>=0) el.outerHTML = stationHTML(ss.items[idx], idx, ss.items);
}
function libGameHTML(sk, stId){
  const g = sk.games[stId];
  return '<details class="block"><summary><span class="bar"></span><span class="bt"><b>'+g.n+'</b><small>'+sk.name+'</small></span></summary>'+
   '<div class="body">'+
   '<p><strong>Setup.</strong> '+g.setup+'</p><p><strong>A.</strong> '+g.a+'</p><p><strong>B.</strong> '+g.b+'</p>'+
   LV.map((nm,i)=>'<div class="lvrow">'+pips(i+1)+'<p><strong>'+nm+'.</strong> '+g.lv[i]+'</p></div>').join("")+
   '<p><strong>Rounds.</strong> '+g.sec+' seconds.</p>'+
   '<p><strong>Watch for.</strong> '+g.watch+'</p><p><strong>Ask.</strong> '+g.ask+'</p>'+
   '</div></details>';
}

  const wl = v => v<60 ? v+"s" : (v%60===0 ? (v/60)+" min" : Math.floor(v/60)+":"+String(v%60).padStart(2,"0"));
  return '<h2>Timer</h2><span class="tapebar"></span>'+
   '<div class="timer'+(T.phase==="rest"?' rest':'')+'" id="tbox"><div id="tdisp">'+fmt(T.remaining)+'</div><div id="tstat"></div>'+
   '<button class="btn" id="tbtn" data-a="ttoggle">Start</button>'+
   '<button class="btn ghost" data-a="treset">Reset</button></div>'+
   '<h3 style="margin-top:0">Round length</h3><div class="chips">'+[30,45,60,90,120,180,300].map(v=>chip("work",v,wl(v))).join("")+'</div>'+
   '<h3 style="margin-top:0">Rest between rounds</h3><div class="chips">'+[0,5,10,15,30].map(v=>chip("rest",v,v===0?"None":v+"s")).join("")+'</div>'+
   '<p class="small muted">Three beeps end a round, one ends a rest, and the phone vibrates. The timer keeps running when you switch tabs and shows at the top of the screen.</p>';
}

/* =====================  RENDER  ===================== */
function render(){
  let h = "";
  if(S.tab==="plan") h = (S.view==="session" && S.skill) ? viewSession() : viewSetup();
  else if(S.tab==="skills") h = viewSkills();
  else if(S.tab==="library") h = viewLibrary();
  else h = viewTimer();
  $("#app").innerHTML = h;
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    if(b.dataset.v===S.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  paintTimer();
}
function rerender(){ const y = window.scrollY; render(); window.scrollTo(0,y); }

/* =====================  TIMER  ===================== */
function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
function audio(){
  if(!T.ctx){ const C = window.AudioContext||window.webkitAudioContext; if(C) T.ctx = new C(); }
  if(T.ctx && T.ctx.state==="suspended") T.ctx.resume();
}
function beep(n){
  if(T.ctx){
    for(let i=0;i<n;i++){
      const o = T.ctx.createOscillator(), g = T.ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(T.ctx.destination);
      const t = T.ctx.currentTime + i*0.25;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
      o.start(t); o.stop(t+0.2);
    }
  }
  if(navigator.vibrate) navigator.vibrate(n>1?[200,100,200]:200);
}
async function lockScreen(){ try{ if("wakeLock" in navigator) T.wl = await navigator.wakeLock.request("screen"); }catch(e){} }
function unlockScreen(){ try{ if(T.wl){ T.wl.release(); T.wl=null; } }catch(e){} }
function paintTimer(){
  const d = $("#tdisp");
  if(d){
    d.textContent = fmt(T.remaining);
    $("#tstat").textContent = (T.phase==="rest" ? "Rest" : "Round "+T.round) + (T.running ? "" : (T.started ? " (paused)" : ""));
    $("#tbtn").textContent = T.running ? "Pause" : (T.started ? "Resume" : "Start");
    $("#tbox").classList.toggle("rest", T.phase==="rest");
  }
  const show = T.started && S.tab!=="timer";
  $("#mini").hidden = !show;
  document.body.classList.toggle("has-mini", show);
  if(show){
    $("#mtxt").textContent = (T.phase==="rest" ? "Rest " : "Round "+T.round+"  ") + fmt(T.remaining);
    $("#mbtn").textContent = T.running ? "Pause" : "Resume";
  }
}
function tick(){
  if(!T.running) return;
  let rem = Math.ceil((T.endAt - Date.now())/1000);
  if(rem<=0){
    if(T.phase==="work"){
      beep(3);
      if(T.rest>0){ T.phase="rest"; T.remaining=T.rest; } else { T.round++; T.remaining=T.work; }
    }else{
      beep(1); T.phase="work"; T.round++; T.remaining=T.work;
    }
    T.endAt = Date.now() + T.remaining*1000; rem = T.remaining;
  }
  T.remaining = rem; paintTimer();
}
setInterval(tick,250);
function timerToggle(){
  if(!T.running){ audio(); T.running=true; T.started=true; T.endAt=Date.now()+T.remaining*1000; lockScreen(); }
  else{ T.remaining=Math.max(1,Math.ceil((T.endAt-Date.now())/1000)); T.running=false; unlockScreen(); }
  paintTimer();
}
function timerReset(){
  T.running=false; T.started=false; T.phase="work"; T.remaining=T.work; T.round=1; unlockScreen(); paintTimer();
}
async function setAwake(on){
  S.awake = on;
  try{
    if(on){ if("wakeLock" in navigator) T.awakeLock = await navigator.wakeLock.request("screen"); }
    else if(T.awakeLock){ T.awakeLock.release(); T.awakeLock = null; }
  }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && S.awake) setAwake(true); });

/* =====================  COPY  ===================== */
function planText(){
  const ss = session(), sk = ss.sk, b = ss.b, L = [];
  L.push("READ THE ROOM: "+sk.name);
  L.push(summaryLine());
  L.push("");
  L.push("Warm-up ("+b.warm+" min): "+sk.warm);
  ss.items.forEach(it=>{
    L.push(""); L.push(it.st.name+" ("+it.mins+" min): "+it.g.n);
    L.push("Setup: "+it.g.setup); L.push("A: "+it.g.a); L.push("B: "+it.g.b);
    LV.forEach((nm,i)=>L.push("Level "+(i+1)+" "+nm+(it.lm[i]>0?" ("+it.lm[i]+" min)":"")+": "+it.g.lv[i]));
    L.push("Rounds: "+it.g.sec+" seconds"); L.push("Watch for: "+it.g.watch); L.push("Ask: "+it.g.ask);
  });
  L.push(""); L.push("Live rounds ("+b.live+" min): "+sk.live);
  L.push("Close ("+b.close+" min): What did you notice, and what would you change? One takeaway each.");
  return L.join("\n");
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1800); }
function copyText(text, msg){
  const done = ()=>toast(msg);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else fallbackCopy(text,done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("Copy not available here"); }
  document.body.removeChild(ta);
}

/* =====================  EVENTS  ===================== */
function buildSession(){
  if(!S.skill) return;
  const first = STATIONS.map(s=>s.id).find(id=>S.stations.includes(id));
  S.view="session"; S.tab="plan"; S.lv={}; S.open={}; S.open[first]=true;
  save(); render(); window.scrollTo(0,0);
}
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-a]"); if(!el) return;
  const a = el.dataset.a, v = el.dataset.v, g = el.dataset.g;
  if(a==="tab"){ S.tab=v; render(); window.scrollTo(0,0); }
  else if(a==="set"){ S[g] = (g==="time") ? Number(v) : v; save(); rerender(); }
  else if(a==="stn"){
    const has = S.stations.includes(v);
    if(has && S.stations.length===1){ toast("Keep at least one position"); return; }
    const sel = has ? S.stations.filter(x=>x!==v) : S.stations.concat(v);
    S.stations = STATIONS.map(s=>s.id).filter(id=>sel.includes(id)); save(); rerender();
  }
  else if(a==="skill"){ S.skill=v; save(); rerender(); }
  else if(a==="build"){ buildSession(); }
  else if(a==="useSkill"){ S.skill=v; buildSession(); }
  else if(a==="edit"){ S.view="setup"; render(); window.scrollTo(0,0); }
  else if(a==="lv"){ S.lv[el.dataset.st]=Number(v); S.open[el.dataset.st]=true; paintStation(el.dataset.st); }
  else if(a==="next"){
    const d = document.querySelector("#st-"+v+" details"); const cur = el.closest("details");
    if(cur){ cur.open=false; S.open[cur.dataset.id]=false; }
    if(d){ d.open=true; S.open[v]=true; d.scrollIntoView({block:"start", behavior: reduceMotion ? "auto" : "smooth"}); }
  }
  else if(a==="settimer"){
    T.work=Number(el.dataset.sec); T.rest=10; T.phase="work"; T.remaining=T.work; T.round=1;
    T.running=false; T.started=false; unlockScreen(); S.tab="timer"; render(); window.scrollTo(0,0);
  }
  else if(a==="awake"){ const on=!S.awake; setAwake(on); el.setAttribute("aria-pressed", String(on)); }
  else if(a==="copy"){ copyText(planText(), "Session copied"); }
  else if(a==="copycustom"){ copyText(customText(), "Game copied"); }
  else if(a==="ttoggle"){ timerToggle(); }
  else if(a==="treset"){ timerReset(); }
  else if(a==="tset"){
    T[g]=Number(v);
    if(g==="work"||!T.started){ T.phase="work"; T.remaining=T.work; T.round=1; T.running=false; T.started=false; unlockScreen(); }
    rerender();
  }
});
document.addEventListener("toggle", e=>{
  const d = e.target;
  if(d && d.matches && d.matches("details[data-id]")) S.open[d.dataset.id] = d.open;
}, true);
document.addEventListener("input", e=>{
  const f = e.target.dataset && e.target.dataset.f; if(!f) return;
  S.custom[f] = e.target.value;
  const o = $("#customOut"); if(o) o.textContent = customText();
});

load();
render();
</script>
</body>
